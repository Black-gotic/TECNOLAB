{% extends 'base.html' %}

{% block title %}Contato — TECNOLAB{% endblock %}

{% block content %}
<section class="section" style="padding-top: 8rem;">
    <h2 class="section-title">Entre em Contato</h2>

    <div class="contact-container">
        <!-- Formulário Funcional com Validação Backend Flask -->
        <form action="{{ url_for('contact') }}" method="POST" class="contact-form">
            <div class="form-group">
                <label for="name">Nome completo</label>
                <input type="text" id="name" name="name" required placeholder="Seu nome">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
            </div>

            <div class="form-group">
                <label for="subject">Assunto</label>
                <input type="text" id="subject" name="subject" required placeholder="Orçamento, dúvida, etc.">
            </div>

            <div class="form-group">
                <label for="message">Mensagem</label>
                <textarea id="message" name="message" rows="5" required placeholder="Descreva os detalhes do seu projeto..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar Mensagem</button>
        </form>

        <!-- Informações de Contato -->
        <div class="contact-info">
            <h3 style="color: var(--accent-cyan); margin-bottom: 1.5rem;">Informações de Contato</h3>
            
            <div class="info-item">
                <h4>Atendimento</h4>
                <p>Desenvolvimento de projetos e orçamentos sob medida.</p>
            </div>

            <div class="info-item">
                <h4>E-mail</h4>
                <p>contato@tecnolab.com.br</p>
            </div>

            <div class="info-item">
                <h4>Redes Sociais</h4>
                <p>
                    <a href="#" class="card-link">YouTube</a> | 
                    <a href="#" class="card-link">Instagram</a> | 
                    <a href="#" class="card-link">TikTok</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
